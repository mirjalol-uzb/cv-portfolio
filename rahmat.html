<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Rahmat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #020617; /* qorong'i fon */
    }
    .box {
      background: #020620; /* fonni to'g'ri keladigan qilib qo'yamiz */
      padding: 32px;
      border-radius: 14px;
      text-align: center;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      color: white; /* matn oq bo'lsin */
    }
    .box h1 {
      margin-bottom: 10px;
    }
    .box p {
      color: #e0e7ff; /* matn biroz ochroq */
    }
    .box a {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 22px;
      background: #38bdf8; /* havo rangi */
      color: #020617; /* tugma matni qorong'i */
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.2s;
    }
    .box a:hover {
      background: #0ea5e9; /* hover biroz quyuqroq */
      color: white;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Rahmat! ✅</h1>
    <p>Xabaringiz muvaffaqiyatli yuborildi.</p>
    <p>Tez orada siz bilan bog'lanamiz!</p>
    <a href="index.html">Asosiy sahifaga qaytish</a>
  </div>

</body>
</html>
